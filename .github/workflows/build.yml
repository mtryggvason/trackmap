# Builds TrackMap for macOS on every push to main (downloadable from the run's artifacts) and,
# for tags like v0.1.0, publishes a GitHub Release with the zipped app attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Fetch GPUI
        run: scripts/fetch-gpui.sh

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle-macos.sh --universal
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Build universal app
        run: scripts/bundle-macos.sh --universal
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - uses: actions/upload-artifact@v4
        with:
          name: TrackMap-macos
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Install
            1. Download the zip below and double-click it to unzip **TrackMap.app**.
            2. Move it to your Applications folder.
            3. The first time, **right-click TrackMap → Open → Open** (it isn't notarized by Apple,
               so a normal double-click is blocked once). If macOS still refuses, open
               System Settings → Privacy & Security and click **Open Anyway**.

            Works on Apple Silicon and Intel Macs (macOS 12 or later).
