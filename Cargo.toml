[workspace]
resolver = "2"
members = ["crates/core", "crates/graph", "crates/app"]
exclude = ["vendor"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
trackmap-core = { path = "crates/core" }
trackmap-graph = { path = "crates/graph" }
# GPUI from Zed's repo at a pinned commit, checked out into vendor/zed by
# scripts/fetch-gpui.sh (the 0.2.2 release has no trackpad pinch support).
gpui = { path = "vendor/zed/crates/gpui" }
# runtime_shaders: compile Metal shaders at startup so a full Xcode install is not required.
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["font-kit", "runtime_shaders"] }

# Keep target/ small: full debug info only for our own crates, none for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Audio decoding and FFT are far too slow unoptimised; optimise them even in dev builds.
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.symphonia]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-common]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-format-caf]
opt-level = 3
[profile.dev.package.symphonia-format-isomp4]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-format-riff]
opt-level = 3
[profile.dev.package.symphonia-metadata]
opt-level = 3
[profile.dev.package.trackmap-core]
opt-level = 2
