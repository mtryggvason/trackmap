  <!-- TrackMap app icon: an orange toy-brick baseplate as a star map, tracks as yellow studs
       joined by a route, circled by an orbit with a little ship. 80s space-toy style.
       Generated from a short script in the commit that added it; edit freely by hand. -->
  <defs>
    <clipPath id="front"><rect x="0" y="596" width="1024" height="428"/></clipPath>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2B53"/>
      <stop offset="1" stop-color="#0E1530"/>
    </linearGradient>
  </defs>

  <!-- macOS icon body: deep space with a few stars -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#space)"/>
  <circle cx="214" cy="236" r="6" fill="#F8E8D2" opacity="0.85"/>
