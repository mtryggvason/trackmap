[package]
name = "trackmap-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25.1", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.191"
lofty = "0.25.5"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mpa", "wav", "flac", "aiff", "caf", "ogg", "vorbis", "pcm", "isomp4", "all-meta", "opt-simd"] }
unicode-normalization = "0.1"
walkdir = "2.5.1"

[dev-dependencies]
tempfile = "3.27.0"
